[project]
name = "sound-ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "interpret>=0.7.8",
    "joblib>=1.5.3",
    "librosa>=0.11.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "mne>=1.12.1",
    "mosqito>=1.2.1",
    "neurokit2>=0.2.12",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "pyloudnorm>=0.2.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "shap>=0.49.1",
    "soundfile>=0.14.0",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "xgboost>=3.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soundml"]
